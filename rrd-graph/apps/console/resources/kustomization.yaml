apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: match

resources:
- console-service.yaml

images:
- name: "rrd-console"
  newName: asia-southeast1-docker.pkg.dev/multi-gke-ops/gke-repo/console
  newTag: latest

patches:
- patch: |-
    - op: add
      path: "/spec/template/spec/containers/0/env/-"
      value:
        name: PROJECT_ID
        value: "multi-gke-ops"


  target:
    kind: Service

