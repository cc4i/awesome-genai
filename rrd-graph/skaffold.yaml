apiVersion: skaffold/v4beta11
kind: Config
build:
  platforms:
    - linux/amd64
    - linux/arm64
  artifacts:
  - image: asia-southeast1-docker.pkg.dev/multi-gke-ops/gke-repo/analysis-service
    docker:
      dockerfile: Dockerfile.analysis

  - image: asia-southeast1-docker.pkg.dev/multi-gke-ops/gke-repo/loadgen-job
    docker:
      dockerfile: Dockerfile.loadgen

  - image: asia-southeast1-docker.pkg.dev/multi-gke-ops/gke-repo/console-service
    docker:
      dockerfile: Dockerfile.console


manifests:
  kustomize:
    paths:
      - apps/analysis/resources
      - apps/loadgen/resources
      - apps/console/resources

deploy:
  cloudrun:
    projectid: multi-gke-ops
    region: asia-southeast1

profiles:
- name: gcb
  build:
    googleCloudBuild: {}

# Individual service profiles for building one by one (all support both architectures)
- name: analysis
  build:
    platforms:
      - linux/amd64
      - linux/arm64
    artifacts:
    - image: asia-southeast1-docker.pkg.dev/multi-gke-ops/gke-repo/analysis-service
      docker:
        dockerfile: Dockerfile.analysis
  manifests:
    kustomize:
      paths:
        - apps/analysis/resources
  deploy:
    cloudrun:
      projectid: multi-gke-ops
      region: asia-southeast1

- name: loadgen
  build:
    platforms:
      - linux/amd64
      - linux/arm64
    artifacts:
    - image: asia-southeast1-docker.pkg.dev/multi-gke-ops/gke-repo/loadgen-job
      docker:
        dockerfile: Dockerfile.loadgen
  manifests:
    kustomize:
      paths:
        - apps/loadgen/resources
  deploy:
    cloudrun:
      projectid: multi-gke-ops
      region: asia-southeast1

- name: console
  build:
    artifacts:
    - image: asia-southeast1-docker.pkg.dev/multi-gke-ops/gke-repo/console-service
      docker:
        dockerfile: Dockerfile.console
  manifests:
    kustomize:
      paths:
        - apps/console/resources
  deploy:
    cloudrun:
      projectid: multi-gke-ops
      region: asia-southeast1


